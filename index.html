<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patton Janssen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23ffffff'/%3E%3C/svg%3E">
<style>
  :root{
    --stroke: 1px;        /* every structural line, including the outer frame */
    --type: 12px;
    --track: 0.09em;
    --pad: 14px;
    --outline: 1px;       /* text stroke weight */
    --blue: #0033FF;      /* nav hover / current section */
    --inset: 30px;        /* space from a full-window image to the frame */
    --n: 4;               /* nav sections — drives every column width below */
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#fff; }
  body{
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
    color:#000;
    -webkit-font-smoothing:antialiased;
  }

  .frame{
    position:fixed; inset:0;
    border: var(--stroke) solid #000;
    display:flex; flex-direction:column;
    background:#fff;
  }

  /* ---------------- nav bars ---------------- */

  .nav{ display:grid; flex:0 0 auto; }
  .nav-top{
    grid-template-columns:repeat(var(--n),1fr);
    border-bottom:var(--stroke) solid #000;
    overflow:hidden;               /* labels never escape the bar */
  }

  .nav-bottom{
    position:absolute; left:0; bottom:0;
    width:calc(100% / var(--n));
    grid-template-columns:1fr;
    background:#fff;
    border-top:var(--stroke) solid #000;
    border-right:var(--stroke) solid #000;
    z-index:20;
  }

  .cell{
    display:flex; align-items:center;
    border-right:var(--stroke) solid #000;
    padding:var(--pad) 10px;
    overflow:hidden;
    min-width:0;
  }
  .nav .cell:last-child{ border-right:0; }
  .nav-top .cell{ justify-content:center; }
  .nav-bottom .cell{ justify-content:flex-start; }

  /* outlined type: white fill, black stroke, fills black on hover */
  .hit{
    font-family:inherit; font-weight:700;
    font-size:var(--type); letter-spacing:var(--track);
    text-transform:uppercase; white-space:nowrap;
    line-height:1.15;
    background:none; border:0; padding:0;
    color:#fff;
    -webkit-text-stroke:var(--outline) #000;
    paint-order: stroke fill;
    flex:0 0 auto;
  }

  button.hit{ cursor:pointer; transition:color .12s linear; }
  button.hit:hover,
  button.hit:focus-visible,
  button.hit[aria-current="true"]{ color:#000; outline:none; }

  /* top nav: plain black type on white, whole cell fills blue on hover */
  .nav-top .cell{ cursor:pointer; transition:background .12s linear; }
  .nav-top .hit{ color:#000; -webkit-text-stroke:0; transition:color .12s linear; }
  .nav-top .cell:hover,
  .nav-top .cell:focus-within,
  .nav-top .cell.current{ background:var(--blue); }
  .nav-top .cell:hover .hit,
  .nav-top .cell:focus-within .hit,
  .nav-top .cell.current .hit{ color:#fff; }

  .copyright{ font-size:9px; color:#000; -webkit-text-stroke:0; }
  .signature{ font-size:11px; }

  /* ---------------- stage ---------------- */

  .stage{
    flex:1 1 auto; min-height:0;
    display:grid;
    grid-template-columns: calc(100% / var(--n)) 1fr;
    position:relative;
  }

  /* --- column 1 --- */

  .col-index{
    display:flex; flex-direction:column; min-height:0;
    border-right:var(--stroke) solid #000;
  }

  .index-wrap{
    position:relative; flex:0 0 auto; min-height:0;
    aspect-ratio:1 / 1;
    border-bottom:var(--stroke) solid #000;
  }

  .index-list{
    height:100%; overflow-y:auto;
    padding:6px 0;
    scrollbar-width:none;
  }
  .index-list::-webkit-scrollbar{ display:none; }

  .p-item{ padding:7px calc(var(--pad) + 2px); }

  /* scroll cue, bottom-right of the project box */
  .scroll-cue{
    position:absolute; right:11px; bottom:9px;
    width:15px; height:15px;
    pointer-events:none;
    opacity:1; transition:opacity .25s ease;
  }
  .scroll-cue.hidden{ opacity:0; }
  .scroll-cue svg{ width:100%; height:100%; fill:none; stroke:#000; stroke-width:2.2; }

  .desc{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    padding:calc(var(--pad) + 2px);
    scrollbar-width:none;
  }
  .desc::-webkit-scrollbar{ display:none; }
  .desc h2{
    font-size:var(--type); font-weight:700;
    letter-spacing:var(--track); text-transform:uppercase;
    margin-bottom:10px;
  }
  .desc .meta{
    font-size:10px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; margin-bottom:14px;
  }
  .desc p{ font-size:12px; line-height:1.55; max-width:42ch; }

  /* --- columns 2–4 : no internal lines --- */

  .col-field{
    position:relative; min-height:0; overflow:hidden;
  }

  .field-scroll{ height:100%; overflow-y:auto; scrollbar-width:none; }
  .field-scroll::-webkit-scrollbar{ display:none; }
  .field-scroll.no-scroll{ overflow:hidden; }

  .row{ display:grid; grid-template-columns:repeat(3,1fr); }

  .slot{
    position:relative; aspect-ratio:var(--ar, 4/3);
    background:#fff; border:0; padding:0;
    display:block; overflow:hidden; cursor:zoom-in;
  }
  .slot img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* single image: no repetition, fit to the window */
  .solo{
    height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:var(--inset);
  }
  /* fill the padded box on whichever axis runs out first, then stop */
  .solo img{ width:100%; height:100%; object-fit:contain; display:block; }

  /* one image at a time, swiped sideways (mobile) */
  .carousel{
    height:100%;
    display:flex;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
  }
  .carousel::-webkit-scrollbar{ display:none; }
  .cslide{
    flex:0 0 100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    scroll-snap-align:center;
    padding:var(--inset);
  }
  .cslide img{ width:100%; height:100%; object-fit:contain; display:block; }

  /* slideshow */
  .slideshow{
    position:relative; height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:var(--inset);
  }
  .slideshow img{ width:100%; height:100%; object-fit:contain; display:block; }

  /* the button fills the gap between image and frame; the chevron is centred
     in it, and the tall target keeps it easy to hit */
  /* the image itself advances the slideshow: left half back, right half on */
  .half{
    position:absolute; top:var(--inset); bottom:var(--inset);
    background:none; border:0; padding:0; cursor:pointer; z-index:1;
  }
  .half.prev{ left:var(--inset); right:50%; }
  .half.next{ left:50%; right:var(--inset); }
  .half:focus-visible{ outline:none; }

  .arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:var(--inset); height:120px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:0; padding:0; cursor:pointer;
  }
  .arrow.prev{ left:0; }
  .arrow.next{ right:0; }
  .arrow svg{
    width:10px; height:14px;
    fill:none; stroke:#000; stroke-width:1;
    stroke-linecap:butt; stroke-linejoin:miter;
    transition:stroke-width .12s linear;
  }
  /* keep the line at a true 1px however far the chevron is scaled down */
  .arrow svg polyline{ vector-effect:non-scaling-stroke; }
  .arrow:hover svg, .arrow:focus-visible svg{ stroke-width:2.4; outline:none; }
  .arrow:focus-visible{ outline:none; }

  .counter{
    position:absolute; left:20px; bottom:14px;
    font-size:10px; font-weight:700; letter-spacing:.12em;
    color:#fff; -webkit-text-stroke:.5px #000;
  }

  /* expanded image */
  .expanded{
    position:absolute; inset:0; background:#fff;
    display:none; align-items:center; justify-content:center;
    padding:var(--inset); cursor:zoom-out; z-index:5;
  }
  .expanded.on{ display:flex; }
  .expanded img{ width:100%; height:100%; object-fit:contain; display:block; }
  .expanded .caption{
    position:absolute; left:20px; bottom:14px;
    font-size:10px; font-weight:700; letter-spacing:.12em;
    color:#fff; -webkit-text-stroke:.5px #000;
  }

  /* ---------------- about ---------------- */
  a.hit{ text-decoration:none; display:inline-block; cursor:pointer; transition:color .12s linear; }
  a.hit:hover, a.hit:focus-visible{ color:#000; outline:none; }

  .desc .bio{ margin-bottom:12px; }
  .desc .bio:last-child{ margin-bottom:0; }

  .desc-cue{
    display:none;
    position:absolute; right:11px; bottom:9px;
    width:15px; height:15px; pointer-events:none;
    opacity:1; transition:opacity .25s ease; z-index:3;
  }
  .desc-cue.hidden{ opacity:0; }
  .desc-cue svg{ width:100%; height:100%; fill:none; stroke:#000; stroke-width:2.2; }

  /* ---------------- mobile ---------------- */
  @media (max-width: 700px){
    :root{
      --inset: 0px;
      /* the description box takes the height the square project box had */
      --descH: calc((100vw - 2px) / var(--n));
    }

    /* nav keeps its shape; labels get down to a 2px gap before anything clips */
    .nav-top .cell{ padding:var(--pad) 6px; }

    .nav-bottom{ display:none; }

    .stage{ display:flex; flex-direction:column; }

    .col-field{ order:1; flex:1 1 auto; min-height:0; }

    .col-index{
      order:2; flex:0 0 auto;
      position:relative;
      border-right:0;
      border-top:var(--stroke) solid #000;
    }

    /* project titles run left to right and swipe */
    .index-wrap{
      aspect-ratio:auto;
      height:calc(var(--descH) / 4);
    }
    .index-list{
      display:flex; align-items:center;
      overflow-x:auto; overflow-y:hidden;
      padding:0;
    }
    .p-item{ padding:0 11px; white-space:nowrap; flex:0 0 auto; }
    .p-item:first-child{ padding-left:6px; }

    .scroll-cue{
      top:50%; right:7px; bottom:auto;
      transform:translateY(-50%) rotate(-90deg);
    }

    .desc{
      flex:0 0 auto;
      height:var(--descH);
      overflow-y:auto;
      padding:5px 6px;
    }
    .desc p{ max-width:none; }
    .desc h2{ display:none; }
    .desc .meta{ margin-bottom:5px; }
    .desc-cue{ display:block; }
  }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>

<div class="frame">

  <nav class="nav nav-top" id="navTop"></nav>

  <main class="stage" id="stage">
    <div class="col-index">
      <div class="index-wrap" id="indexWrap">
        <div class="index-list" id="indexList"></div>
        <span class="scroll-cue" id="scrollCue" aria-hidden="true">
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 16 18 9"/></svg>
        </span>
      </div>
      <div class="desc" id="desc"></div>
      <span class="desc-cue" id="descCue" aria-hidden="true">
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 16 18 9"/></svg>
      </span>
    </div>

    <div class="col-field" id="colField">
      <div class="field-scroll" id="fieldScroll"></div>
      <div class="expanded" id="expanded">
        <img id="expandedImg" alt="">
        <span class="caption" id="expandedCap"></span>
      </div>
    </div>

  </main>

  <nav class="nav nav-bottom">
    <div class="cell"><span class="hit copyright">&copy; Patton Janssen, All Rights Reserved</span></div>
  </nav>

</div>

function pick(i){ return POOL[((i % POOL.length) + POOL.length) % POOL.length]; }

function imgTag(im){
  return '<img src="' + im.src + '" alt="' + im.label + '">';
}
function makeImages(prefix,n,seed){
  seed = seed || 0;
  const out=[];
  for(let i=0;i<n;i++){
    const src = pick(i + seed * 5);
    const label = prefix+'-'+String(i+1).padStart(2,'0');
    out.push({ src: src.src, label, w: src.w, h: src.h });
  }
  return out;
}

/* scale a label down as far as it needs to go to fit its cell */
function fitLabel(el){
  const cell = el.parentElement;
  el.style.fontSize = '';
  el.style.webkitTextStroke = '';

  const cs = getComputedStyle(cell);
  const avail = cell.clientWidth
              - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const base    = parseFloat(getComputedStyle(el).fontSize);
  const natural = el.offsetWidth;
  if(!natural || !avail) return;

  if(natural > avail){
    // letter-spacing is in em, so width scales linearly with type size
    const size = Math.max(3, (base * (avail / natural) * 0.98));
    el.style.fontSize = size.toFixed(2) + 'px';
    scaleStroke(el, size);   // thins an outline only if the label has one
  }
}

/* Size a group of labels together: find the one with the least room to spare
   and give every label in the group that size, so they stay uniform and the
   tightest one lands exactly on its cell's padding. */
function fitSet(items){
  if(!items.length) return;
  items.forEach(el=>{ el.style.fontSize = ''; el.style.webkitTextStroke = ''; });

  const base = parseFloat(getComputedStyle(items[0]).fontSize);
  let ratio = 1;
  items.forEach(el=>{
    const cell  = el.parentElement;
    const cs    = getComputedStyle(cell);
    const avail = cell.clientWidth
                - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if(avail > 0 && el.offsetWidth > 0) ratio = Math.min(ratio, avail / el.offsetWidth);
  });
  if(ratio >= 1) return;

  const size = Math.max(3, base * ratio * 0.995);
  items.forEach(el=>{
    el.style.fontSize = size.toFixed(2) + 'px';
    scaleStroke(el, size);
  });
}

/* only thin an outline that actually exists — the nav has none now */
function scaleStroke(el, size){
  const w = parseFloat(getComputedStyle(el).webkitTextStrokeWidth) || 0;
  if(w > 0) el.style.webkitTextStroke = Math.max(0.2, size / 16).toFixed(2) + 'px #000';
}

function fitLabels(){

  }
}

/* The project column sizes as a set: find the longest title, work out the size
   that makes it fit, then give every title in the column that same size. */
function fitProjects(){
  const items = [...indexList.querySelectorAll('.hit')];
  const sample = indexList.querySelector('.p-item');
  if(!items.length || !sample) return;

  items.forEach(el=>{ el.style.fontSize = ''; el.style.webkitTextStroke = ''; });
  if(MOBILE.matches) return;          // the strip scrolls sideways instead

  const cs    = getComputedStyle(sample);
  const avail = indexList.clientWidth
              - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const base  = parseFloat(getComputedStyle(items[0]).fontSize);
  const widest = items.reduce((m,el)=>Math.max(m, el.offsetWidth), 0);
  if(!avail || !widest || widest <= avail) return;

  const size = Math.max(3, base * (avail / widest) * 0.99);
  items.forEach(el=>{
    el.style.fontSize = size.toFixed(2) + 'px';
    scaleStroke(el, size);
  });
}

/* Re-fitting changes the type size, which changes the nav bar's own height.
   Observing the nav bars therefore fed back into the observer. Watch the frame
   instead (it tracks the viewport and nothing here can resize it), and defer
   the work to the next frame so a single pass can never re-enter itself. */
let fitQueued = false;
function scheduleFit(){
  if(fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(()=>{ fitQueued = false; fitLabels(); fitProjects(); refillGrid(); });
}

window.addEventListener('resize', scheduleFit);
if(window.ResizeObserver){
  new ResizeObserver(scheduleFit).observe(document.querySelector('.frame'));
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleFit);

/* ---------- sections ---------- */
function selectSection(sec){
  activeSection = sec;
  closeExpanded();
  paintNav();

  if(sec.mode === 'about'){ renderAbout(); return; }

  renderIndex();
  selectProject(sec.projects[0]);
}

function renderIndex(){
  indexList.innerHTML = '';
  activeSection.projects.forEach(p=>{
    const wrap = document.createElement('div');
    wrap.className = 'p-item';
    const b = document.createElement('button');
    b.className = 'hit';
    b.textContent = p.name;
    b.addEventListener('click', ()=>selectProject(p));
    wrap.appendChild(b);
    indexList.appendChild(wrap);
  });
  fitProjects();
}

/* ---------- about ----------
   Same structure as every other section: links in the index box, prose in the
   description panel below it, one image filling the window on the right. */
function renderAbout(){
  activeProject = null;

  indexList.innerHTML = '';
  CONTACT.forEach(c=>{
    const wrap = document.createElement('div');
    wrap.className = 'p-item';
    const a = document.createElement('a');
    a.className = 'hit';
    a.href = c.href;
    a.textContent = c.label;
    wrap.appendChild(a);
    indexList.appendChild(wrap);
  });
  fitProjects();

  desc.innerHTML =
    '<h2>Patton Janssen</h2>' +
    '<div class="meta">Santa Monica, CA</div>' +
    BIO.map(t=>'<p class="bio">'+t+'</p>').join('');

  fieldScroll.innerHTML = '';
  fieldScroll.classList.add('no-scroll');
  const portrait = pick(1);
  const shot = { src: portrait.src, label:'Portrait', w: portrait.w, h: portrait.h };
  if(MOBILE.matches) renderCarousel([shot]); else renderSolo(shot);

  fieldScroll.scrollTop = 0;
  indexList.scrollTop = 0;
  syncIndexHeight();
  resetCue();
}

/* ---------- projects ---------- */
function selectProject(p){
  if(!p) return;
  activeProject = p;
  closeExpanded();

  [...indexList.querySelectorAll('.hit')].forEach((b,i)=>
    b.setAttribute('aria-current', activeSection.projects[i]===p));

  desc.innerHTML =
    '<h2>'+p.name+'</h2>'+
    '<div class="meta">'+p.year+' &nbsp;/&nbsp; '+p.role+'</div>'+
    '<p>'+p.desc+'</p>';

  const imgs = makeImages(activeSection.id.slice(0,2).toUpperCase(), p.count, p.seed);
  fieldScroll.innerHTML = '';
  fieldScroll.classList.remove('no-scroll');

  currentImgs = imgs;

  if(MOBILE.matches){
    renderCarousel(imgs);
  } else if(activeSection.mode === 'slideshow'){
    if(imgs.length === 1) renderSolo(imgs[0]);
    else                  renderSlideshow(imgs);
  } else {
    renderGrid(imgs);                          // fills the window by repeating
  }

  fieldScroll.scrollTop = 0;
  indexList.scrollTop = 0;
  syncIndexHeight();
  resetCue();
}

/* Every image gets a row of three. If the project's images don't reach the
   bottom of the window, keep cycling through them in order until they do. */
function renderGrid(imgs){
  if(!imgs.length) return;

  const slotW  = colField.clientWidth / 3;
  const fieldH = colField.clientHeight;

  const order = [];
  let used = 0, i = 0;
  while(i < imgs.length || used < fieldH){
    const im = imgs[i % imgs.length];
    order.push(im);
    used += slotW * (im.h / im.w);
    i++;
    if(i > 300) break;                        // safety net
  }

  order.forEach(im=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--ar', im.w + '/' + im.h);
    for(let c=0;c<3;c++){                     // same image, three across
      const slot = document.createElement('button');
      slot.className = 'slot';
      slot.innerHTML = imgTag(im);
      slot.addEventListener('click', ()=>openExpanded(im));
      row.appendChild(slot);
    }
    fieldScroll.appendChild(row);
  });
}

function renderCarousel(imgs){
  fieldScroll.classList.add('no-scroll');
  const car = document.createElement('div');
  car.className = 'carousel';
  imgs.forEach(im=>{
    const slide = document.createElement('div');
    slide.className = 'cslide';
    slide.innerHTML = imgTag(im);
    car.appendChild(slide);
  });
  fieldScroll.appendChild(car);
}

function renderSolo(im){
  fieldScroll.classList.add('no-scroll');
  const solo = document.createElement('div');
  solo.className = 'solo';
  solo.innerHTML = imgTag(im);
  fieldScroll.appendChild(solo);
}

const CHEVRON_L = '<svg viewBox="0 0 24 32"><polyline points="18 2 4 16 18 30"/></svg>';
const CHEVRON_R = '<svg viewBox="0 0 24 32"><polyline points="6 2 20 16 6 30"/></svg>';

function renderSlideshow(imgs){
  fieldScroll.classList.add('no-scroll');
  slides = imgs; slideIndex = 0;

  const wrap = document.createElement('div');
  wrap.className = 'slideshow';
  wrap.innerHTML =
    '<button class="half prev" aria-label="Previous image"></button>'+
    '<button class="half next" aria-label="Next image"></button>'+
    '<button class="arrow prev" aria-label="Previous">'+CHEVRON_L+'</button>'+
    imgTag(imgs[0]).replace('<img ', '<img id="slideImg" ')+
    '<button class="arrow next" aria-label="Next">'+CHEVRON_R+'</button>'+
    '<span class="counter" id="counter"></span>';
  fieldScroll.appendChild(wrap);

  wrap.querySelectorAll('.prev').forEach(el=>el.addEventListener('click', ()=>step(-1)));
  wrap.querySelectorAll('.next').forEach(el=>el.addEventListener('click', ()=>step(1)));
  paintSlide();
}

function step(d){
  if(!slides.length) return;
  slideIndex = (slideIndex + d + slides.length) % slides.length;
  paintSlide();
}

function paintSlide(){
  const img = document.getElementById('slideImg');
  const cnt = document.getElementById('counter');
  if(!img) return;
  img.src = slides[slideIndex].src;
  img.alt = slides[slideIndex].label;
  cnt.textContent = String(slideIndex+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
}

/* index box is always one slot tall, whatever the right side is doing */
function padDescription(){
  const bar = document.querySelector('.nav-bottom');
  const showing = bar && bar.offsetParent !== null;
  desc.style.paddingBottom = showing ? (bar.offsetHeight + 16) + 'px' : '';
}

function syncIndexHeight(){
  // the box is a square in CSS; this just keeps the dependent bits in sync
  padDescription();
  resetCue();
}
window.addEventListener('resize', syncIndexHeight);

/* ---------- scroll cue ---------- */
function resetCue(){
  const sideways = MOBILE.matches;
  const spills = sideways
    ? indexList.scrollWidth  > indexList.clientWidth  + 2
    : indexList.scrollHeight > indexList.clientHeight + 2;
  const moved = sideways ? indexList.scrollLeft : indexList.scrollTop;
  scrollCue.classList.toggle('hidden', !spills || moved > 0);

  const descSpills = desc.scrollHeight > desc.clientHeight + 2;
  descCue.classList.toggle('hidden', !descSpills || desc.scrollTop > 0);
}

indexList.addEventListener('scroll', ()=>{
  if(indexList.scrollTop > 0 || indexList.scrollLeft > 0) scrollCue.classList.add('hidden');
});
desc.addEventListener('scroll', ()=>{
  if(desc.scrollTop > 0) descCue.classList.add('hidden');
});

/* ---------- expanded ---------- */
function openExpanded(im){
  expandedImg.src = im.src;
  expandedImg.alt = im.label;
  expandedCap.textContent = activeProject.name+' — '+im.label;
  expanded.classList.add('on');
}
function closeExpanded(){ expanded.classList.remove('on'); }
expanded.addEventListener('click', closeExpanded);

document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeExpanded();
  if(activeSection.mode === 'slideshow' && !expanded.classList.contains('on')){
    if(e.key === 'ArrowLeft')  step(-1);
    if(e.key === 'ArrowRight') step(1);
  }
});

MOBILE.addEventListener('change', ()=>{
  const keep = activeProject;
  if(activeSection.mode === 'about') renderAbout();
  else { renderIndex(); selectProject(keep || activeSection.projects[0]); }
  scheduleFit();
});

selectSection(SECTIONS[0]);
fitLabels();
padDescription();
</script>
</body>
</html>
